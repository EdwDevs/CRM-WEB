<div id="view-transacciones" class="tab-content view-stack">
                <details class="card collapsible-card" open>
                    <summary class="collapsible-card__summary">
                        <h2 class="card-title" id="formTitle">Formulario de nueva transacción</h2>
                    </summary>
                    <!-- IMPORTANTE: el formulario permanece dentro del plegable principal para conservar validación e IDs existentes. -->
                    <form id="transactionForm" class="collapsible-card__content">
                        <input type="hidden" id="editingId" value="">
                        <div class="form-grid">
                            <div class="form-group full-width"><label>Tipo</label><select id="tipo" required onchange="handleTipoChange()"><option value="gasto">💸 Gasto</option><option value="ingreso">💰 Ingreso</option><option value="credito">💳 Crédito</option><option value="pago_tarjeta">📉 Abono TC</option><option value="transferencia">🔄 Transferencia</option></select></div>
                            <details id="creditConfig" class="form-group full-width form-panel--credit collapsible-card hidden" open>
                                <summary class="collapsible-card__summary"><span class="card-title text-danger">Configuración de crédito</span></summary>
                                <div class="form-panel-grid collapsible-card__content">
                                    <div class="form-group"><label class="text-danger">Tarjeta</label><select id="tarjetaCredito"></select></div>
                                    <div class="form-group"><label class="text-danger">Cuotas</label><input type="number" id="cuotas" value="1"></div>
                                    <div class="form-group"><label class="text-danger">Cuotas pagadas</label><input type="number" id="cuotasPagadas" value="0" min="0"></div>
                                    <div class="form-group"><label class="text-danger" title="Valor exacto de la cuota mensual si difiere de Monto/Cuotas. Opcional.">Valor Cuota (Opc.)</label><input type="text" id="valorCuotaManual" inputmode="decimal" pattern="[$ 0-9.,]*" oninput="formatCurrencyInput(this)" placeholder="$0"></div>
                                    <div class="form-group full-width"><label class="text-danger">Fecha próxima de pago</label><input type="date" id="creditoFechaPago"></div>
                                </div>
                            </details>
                            <details id="divPagoTarjeta" class="form-group full-width form-panel--success collapsible-card hidden" open>
                                <summary class="collapsible-card__summary"><span class="card-title text-success">Pago tarjeta</span></summary>
                                <div class="form-group collapsible-card__content"><label class="text-success">Tarjeta a Pagar</label><select id="tarjetaDestinoPago"></select></div>
                            </details>
                            <div class="form-group" id="metodoPagoDiv"><label id="lblMetodoPago">Método</label><select id="metodoPago"><option value="debito">Débito</option><option value="efectivo">Efectivo</option><option value="nequi">Nequi</option></select></div>
                            <details class="form-group full-width collapsible-card hidden" id="metodoDestinoDiv" open>
                                <summary class="collapsible-card__summary"><span class="card-title">Transferencia</span></summary>
                                <div class="form-group collapsible-card__content"><label>Destino</label><select id="metodoDestino"><option value="debito">Débito</option><option value="efectivo">Efectivo</option><option value="nequi">Nequi</option></select></div>
                            </details>
                            <div class="form-group"><label>Monto</label><input type="text" id="monto" class="form-control--money" required inputmode="decimal" pattern="[$ 0-9.,]*" oninput="formatCurrencyInput(this)"></div>
                            <div class="form-group"><label>Categoría</label><select id="categoria" required></select></div>
                            <div class="form-group hidden" id="subcategoriaDiv"><label>Subcategoría</label><select id="subcategoria"></select></div>
                            <div class="form-group"><label>Responsable</label><select id="miembro"><option value="papa">Papá</option><option value="mama">Mamá</option><option value="hijo1">Hijo/a 1</option><option value="compartido">Compartido</option></select></div>
                            <div class="form-group full-width"><label>Descripción</label><input type="text" id="descripcion" required></div>
                            <div class="form-group"><label>Fecha</label><input type="date" id="fecha" required></div>
                        </div>
                        <div class="form-actions">
                            <button type="button" onclick="preSubmit()" class="btn btn--primary btn--lg" id="btnSubmitText">Guardar</button>
                            <button type="button" id="btnCancelar" class="btn btn--ghost btn--lg hidden" onclick="cancelEdit()">Cancelar</button>
                        </div>
                    </form>
                </details>
            </div>
