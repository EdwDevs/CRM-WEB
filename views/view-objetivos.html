<div id="view-objetivos" class="tab-content view-stack view-transition fade-in">
                <header class="view-header goals-view-header">
                    <div>
                        <p class="view-eyebrow"><i class="fas fa-bullseye"></i> Plan financiero</p>
                        <h1 class="view-header__title">Metas</h1>
                        <p class="view-header__subtitle">Prioriza los objetivos familiares, revisa su avance y mantén visible la próxima meta a cumplir.</p>
                    </div>
                    <div class="view-header__actions">
                        <button onclick="openGoalModal()" class="btn btn--primary btn--md"><i class="fas fa-plus"></i> Nuevo objetivo</button>
                    </div>
                </header>

                <section class="goals-dashboard" aria-label="Resumen visual de metas del hogar">
                    <!-- IMPORTANTE: renderGoals() usa estos IDs para pintar el objetivo destacado, el grid y el estado vacío sin romper el modal/formulario. -->
                    <div id="goalsContainer" class="goals-layout">
                        <div class="skeleton skeleton-goal-hero"></div>
                        <div class="skeleton skeleton-goal-list"></div>
                    </div>
                    <!-- IMPORTANTE: este estado evita que renderGoals() deje el tablero de metas en blanco cuando no hay objetivos. -->
                    <div id="goalsEmptyState" class="empty-state hidden" role="status">
                        <span class="empty-state__icon" aria-hidden="true"><i class="fas fa-bullseye"></i></span>
                        <strong class="empty-state__title">Aún no tienes objetivos creados.</strong>
                        <p class="empty-state__message">Define una meta con monto y fecha para comenzar a medir el avance del hogar.</p>
                        <button class="btn btn--primary btn--sm empty-state__action" type="button" onclick="openGoalModal()">Crear objetivo</button>
                    </div>
                </section>
            </div>
