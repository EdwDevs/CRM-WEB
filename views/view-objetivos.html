<div id="view-objetivos" class="tab-content view-stack">
                <header class="view-header goals-view-header">
                    <div>
                        <p class="view-eyebrow"><i class="fas fa-bullseye"></i> Plan financiero</p>
                        <h1 class="view-title">Metas del hogar</h1>
                        <p class="view-subtitle">Prioriza los objetivos familiares, revisa su avance y mantén visible la próxima meta a cumplir.</p>
                    </div>
                    <div class="view-actions">
                        <button onclick="openGoalModal()" class="btn btn--primary btn--md"><i class="fas fa-plus"></i> Nuevo objetivo</button>
                    </div>
                </header>

                <section class="goals-dashboard" aria-label="Resumen visual de metas del hogar">
                    <!-- IMPORTANTE: renderGoals() usa estos IDs para pintar el objetivo destacado, el grid y el estado vacío sin romper el modal/formulario. -->
                    <div id="goalsContainer" class="goals-layout">
                        <div class="skeleton skeleton-goal-hero"></div>
                        <div class="skeleton skeleton-goal-list"></div>
                    </div>
                    <div id="goalsEmptyState" class="section-empty-state hidden"><strong>Aún no tienes objetivos creados.</strong> Usa “Nuevo objetivo” para definir una meta con monto y fecha.</div>
                </section>
            </div>
