<div id="view-estadisticas" class="tab-content">
                <div class="card">
                    <div class="stats-section-title">
                        <h3><i class="fas fa-gauge-high" style="color:var(--primary);"></i> KPIs rápidos</h3>
                        <span>Resumen ejecutivo mensual</span>
                    </div>
                    <div class="kpi-grid">
                        <div class="mini-stat">
                            <div class="mini-label"><i class="fas fa-calendar-day"></i> Promedio diario</div>
                            <div class="mini-value" id="kpiDailyAverage">$0</div>
                            <div class="kpi-subtitle">Gasto promedio del mes</div>
                        </div>
                        <div class="mini-stat">
                            <div class="mini-label"><i class="fas fa-piggy-bank"></i> Tasa de ahorro</div>
                            <div class="mini-value" id="kpiSavingsRate">0%</div>
                            <div class="kpi-subtitle">Ingresos netos vs ingresos</div>
                        </div>
                        <div class="mini-stat">
                            <div class="mini-label"><i class="fas fa-chart-line"></i> Variación mensual</div>
                            <div class="mini-value" id="kpiMonthlyVariation">$0</div>
                            <div class="kpi-delta" id="kpiMonthlyVariationDetail">--</div>
                        </div>
                    </div>
                </div>

                <div class="stats-chart-grid">
                    <div class="card">
                        <div class="stats-card-head">
                            <h3><i class="fas fa-wave-square" style="color:var(--primary); margin-right:8px;"></i>Tendencia (6 Meses)</h3>
                        </div>
                        <div class="stats-chart-wrap" style="height:300px;"><canvas id="chartTendencias"></canvas></div>
                    </div>

                    <div class="card">
                        <div class="stats-card-head">
                            <h3><i class="fas fa-chart-column" style="color:var(--primary); margin-right:8px;"></i>Ingresos vs Gastos (6 Meses)</h3>
                        </div>
                        <div class="stats-chart-wrap" style="height:320px;"><canvas id="chartIngresosGastos"></canvas></div>
                    </div>
                </div>

                <div class="card">
                    <div class="stats-card-head">
                        <h3><i class="fas fa-chart-pie" style="color:var(--primary); margin-right:8px;"></i>Distribución de Gastos</h3>
                    </div>
                    <div class="stats-chart-wrap" style="height:350px;"><canvas id="chartCategorias"></canvas></div>
                </div>

                <div class="card">
                    <div class="stats-card-head">
                        <h3><i class="fas fa-ranking-star" style="color:var(--primary); margin-right:8px;"></i>Top categorías del mes</h3>
                    </div>
                    <div class="top-category-grid">
                        <div class="top-category-list" id="topCategoriasList"></div>
                        <div class="stats-chart-wrap" style="height:280px;"><canvas id="chartTopCategorias"></canvas></div>
                    </div>
                </div>
            </div>
